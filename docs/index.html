<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Record and display timestamped music color data.">
  <title>Music Color Recorder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <nav class="tabs" aria-label="Tools">
      <button class="tab is-active" type="button" data-tab="record-view" aria-selected="true">Record</button>
      <button class="tab" type="button" data-tab="show-view" aria-selected="false">Color Show</button>
    </nav>

    <section id="record-view" class="tab-view">
      <div class="workspace">
        <section class="audio-panel" aria-labelledby="audio-heading">
          <h2 id="audio-heading">Audio</h2>

          <label class="file-button" for="audio-file">Choose audio file</label>
          <input id="audio-file" class="visually-hidden" type="file" accept="audio/*">

          <div class="file-details" aria-live="polite">
            <span id="file-name">No file selected</span>
            <span id="file-duration">—</span>
          </div>

          <audio id="audio-player" controls preload="metadata"></audio>

          <div class="recording-status" aria-live="polite">
            <span id="status-dot" class="status-dot"></span>
            <span id="recording-status">Choose an audio file to begin</span>
          </div>

          <div class="button-stack">
            <button id="record-button" class="primary-button" type="button" disabled>Start recording</button>
            <button id="download-button" class="secondary-button" type="button" disabled>Download color JSON</button>
          </div>

          <div class="sample-summary">
            <span>Samples</span>
            <strong id="sample-count">0</strong>
          </div>
        </section>

        <section class="colors-panel" aria-labelledby="colors-heading">
          <h2 id="colors-heading">Colors</h2>

          <div class="color-grid">
            <article class="color-card" data-channel="primary">
              <div class="color-card-heading">
                <h3>Primary</h3>
                <label class="null-toggle">
                  <input type="checkbox" data-null-toggle>
                  <span>No color</span>
                </label>
              </div>
              <canvas class="color-field" data-color-field tabindex="0" aria-label="Primary color field"></canvas>
              <div class="selected-color">
                <span class="color-swatch" data-color-swatch></span>
                <code data-color-label>#FF0000</code>
              </div>
            </article>

            <article class="color-card" data-channel="secondary">
              <div class="color-card-heading">
                <h3>Secondary</h3>
                <label class="null-toggle">
                  <input type="checkbox" data-null-toggle checked>
                  <span>No color</span>
                </label>
              </div>
              <canvas class="color-field" data-color-field tabindex="0" aria-label="Secondary color field"></canvas>
              <div class="selected-color">
                <span class="color-swatch" data-color-swatch></span>
                <code data-color-label>None</code>
              </div>
            </article>

            <article class="color-card" data-channel="tertiary">
              <div class="color-card-heading">
                <h3>Tertiary</h3>
                <label class="null-toggle">
                  <input type="checkbox" data-null-toggle checked>
                  <span>No color</span>
                </label>
              </div>
              <canvas class="color-field" data-color-field tabindex="0" aria-label="Tertiary color field"></canvas>
              <div class="selected-color">
                <span class="color-swatch" data-color-swatch></span>
                <code data-color-label>None</code>
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>

    <section id="show-view" class="tab-view" hidden>
      <div class="show-controls">
        <div class="show-files">
          <label class="file-button" for="show-audio-file">Choose audio</label>
          <input id="show-audio-file" class="visually-hidden" type="file" accept="audio/*">
          <span id="show-audio-name" class="show-file-name">No audio selected</span>

          <label class="file-button" for="show-data-file">Choose color data</label>
          <input id="show-data-file" class="visually-hidden" type="file" accept="application/json,.json">
          <span id="show-data-name" class="show-file-name">No color data selected</span>
        </div>

        <input id="show-progress" class="show-progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="Playback position" disabled>

        <div class="show-playback">
          <button id="show-play" class="primary-button" type="button" disabled>Play</button>
          <button id="show-stop" class="secondary-button" type="button" disabled>Stop</button>
          <span id="show-time" class="show-time">0:00.0 / 0:00.0</span>
          <span id="show-status" class="show-status" aria-live="polite">Choose matching audio and color data files</span>
        </div>
      </div>

      <canvas id="color-show-canvas" aria-label="Color show"></canvas>
      <audio id="show-audio" preload="metadata"></audio>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
